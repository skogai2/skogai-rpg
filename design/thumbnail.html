<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="styles.css" />
<style>
html,body{margin:0;padding:0}
body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 250px;overflow:hidden;background:var(--sk-bg)}
.mark{background:#140a26;display:grid;place-items:center;padding:0 40px}
.word{font-family:var(--sk-font-display);font-size:104px;line-height:1;white-space:nowrap;color:#f3e9ff;text-shadow:0 0 12px rgba(255,62,160,.6),0 0 40px rgba(255,62,160,.35)}
.word .b{color:#4ee2ff;text-shadow:0 0 12px rgba(78,226,255,.7),0 0 40px rgba(78,226,255,.35)}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip div{width:100%;height:100%}
</style>
</head>
<body>
<div class="mark"><div class="word"><span class="a">SKOG</span><span class="b">.AI</span></div></div>
<div class="strip">
<div style="background:#4ee2ff"></div>
<div style="background:#3dff9e"></div>
<div style="background:#ff3ea0"></div>
<div style="background:#8a3dff"></div>
</div>
</body>
</html>
