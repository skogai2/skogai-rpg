<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>skogai rpg · play</title>
  <link rel="stylesheet" href="/design/colors_and_type.css" />
  <link rel="stylesheet" href="/design/components.css" />
  <link rel="stylesheet" href="/public/app.css" />
</head>
<body>
<main id="app" class="phone"></main>
<script type="module">
  import { BRANDS, connect, esc, icon, meter, pad, rank } from "/public/client.js";

  const app = document.getElementById("app");
  const token = localStorage.getItem("token") ?? crypto.randomUUID();
  localStorage.setItem("token", token);
  const saved = () => ({
    room: new URLSearchParams(location.search).get("room") ?? localStorage.getItem("room") ?? "",
    name: localStorage.getItem("name") ?? "",
  });
  let me = null;
  let error = "";

  const join = (room, name) => send({ type: "join", room, name, token });

  const send = connect({
    onOpen() {
      const { room, name } = saved();
      if (room && name && me) join(room, name);
      else renderJoin();
    },
    onMessage(msg) {
      if (msg.type === "joined") me = msg.player;
      if (msg.type === "error") { error = msg.message; if (!me) renderJoin(); }
      if (msg.type === "state" && me) render(msg.state);
    },
  });

  function renderJoin() {
    const { room, name } = saved();
    app.innerHTML = `
      <form class="sk-hud stack" id="join" data-cabinet="skognet-syndicate">
        <div class="sk-frame sk-announce"><h2 class="sk-announce-title">INSERT COIN</h2>
          <p class="sk-announce-sub">ENTER THE ROOM CODE FROM THE BIG SCREEN</p></div>
        <label class="sk-field"><span class="sk-field-label">Room</span>
          <input class="sk-input mono" name="room" maxlength="4" autocapitalize="characters" value="${esc(room)}" required /></label>
        <label class="sk-field"><span class="sk-field-label">Handle</span>
          <input class="sk-input" name="name" maxlength="16" value="${esc(name)}" required /></label>
        ${error ? `<p class="bad">${esc(error)}</p>` : ""}
        <button class="sk-btn sk-btn-primary">${icon("play", "sk-icon-16")} JACK IN</button>
      </form>`;
    app.querySelector("#join").onsubmit = (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const r = String(f.get("room")).toUpperCase(), n = String(f.get("name"));
      localStorage.setItem("room", r);
      localStorage.setItem("name", n);
      error = "";
      join(r, n);
    };
  }

  function render(s) {
    const p = s.players.find((x) => x.id === me);
    if (!p) return renderJoin();
    const step = s.step;
    const cabinet = s.quest?.cabinet ?? "skognet-syndicate";
    let body = `<div class="sk-frame sk-announce"><h2 class="sk-announce-title">STAND BY</h2>
      <p class="sk-announce-sub">WATCH THE BIG SCREEN</p></div>`;

    if (s.phase === "step" && step && !p.answered) {
      const input = step.choices
        ? `<div class="choice-grid">${step.choices.map((c, i) =>
            `<button class="sk-btn" data-answer="${i}"><span class="sk-glow-cyan">${i + 1}</span> ${esc(c)}</button>`).join("")}</div>`
        : `<form id="text" class="stack"><input class="sk-input mono" name="v" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="$ _" required />
             <button class="sk-btn sk-btn-primary">${icon("play", "sk-icon-16")} RUN</button></form>`;
      body = `<div class="sk-frame sk-dialogue stack"><div class="sk-dialogue-name">CONTRACT ${step.index + 1} · ${step.xp} XP</div>
        <p class="sk-dialogue-text">${esc(step.prompt)}</p></div>${input}`;
    } else if (s.phase === "step") {
      body = `<div class="sk-frame sk-announce"><h2 class="sk-announce-title">LOCKED IN</h2>
        <p class="sk-announce-sub">WAITING FOR THE CREW…</p></div>`;
    } else if (s.phase === "reveal") {
      body = p.correct
        ? `<div class="sk-frame sk-announce"><h2 class="sk-announce-title">ACCESS GRANTED!</h2><p class="sk-announce-sub ok">+${step.xp} XP</p></div>`
        : `<div class="sk-frame sk-announce"><h2 class="sk-announce-title">ACCESS DENIED</h2><p class="sk-announce-sub">NEXT ONE IS YOURS</p></div>`;
    } else if (s.phase === "done") {
      body = `<div class="sk-plaque sk-plaque-violet"><span class="sk-plaque-label">RANK</span>
          <span class="sk-plaque-value">${rank(p.xp, s.quest.maxXp)}</span></div>
        <div class="sk-plaque sk-plaque-cyan"><span class="sk-plaque-label">LIFETIME XP</span>
          <span class="sk-plaque-value">${pad(p.lifetime)}</span></div>`;
    }

    document.body.dataset.cabinet = cabinet;
    const steps = s.quest?.steps.length ?? 0;
    const doneSteps = !step ? 0 : step.index + (s.phase === "step" ? 0 : 1);
    app.innerHTML = `
      <div class="sk-hud" data-cabinet="${cabinet}">
        <div class="sk-frame sk-hud-bar">
          <div class="sk-hud-brand">${esc(p.name)}<small>▸ ${BRANDS[cabinet][0].replace(/<br \/>/g, " ")} · ROOM ${esc(s.code)}</small></div>
          <div class="sk-hud-stats">
            <div class="sk-stat"><span class="sk-stat-label">XP</span><span></span><span class="sk-stat-value">${pad(p.xp)}</span></div>
            ${steps ? `<div class="sk-stat"><span class="sk-stat-label">STEP</span>${meter(doneSteps, steps)}<span></span></div>` : ""}
          </div>
        </div>
        ${body}
      </div>`;

    app.querySelectorAll("[data-answer]").forEach((b) =>
      (b.onclick = () => send({ type: "answer", value: Number(b.dataset.answer) })));
    const form = app.querySelector("#text");
    if (form) {
      form.querySelector("input").focus();
      form.onsubmit = (e) => {
        e.preventDefault();
        send({ type: "answer", value: String(new FormData(form).get("v")) });
      };
    }
  }
</script>
</body>
</html>
